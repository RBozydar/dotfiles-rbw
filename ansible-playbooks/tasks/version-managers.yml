---
# fnm (Fast Node Manager)
- name: Locate fnm
  ansible.builtin.shell:
    cmd: command -v fnm || true
  register: fnm_lookup
  changed_when: false
  environment:
    PATH: "{{ fnm_path_env }}"

- name: Install fnm
  when: fnm_lookup.stdout | trim == ""
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.shell:
    cmd: curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell
  environment:
    FNM_DIR: "{{ fnm_dir }}"
    FNM_PATH: "{{ fnm_dir }}"
    PATH: "{{ fnm_path_env }}"

- name: Locate fnm after install
  ansible.builtin.shell:
    cmd: command -v fnm || true
  register: fnm_lookup_after_install
  changed_when: false
  environment:
    PATH: "{{ fnm_path_env }}"

- name: Set fnm binary path
  ansible.builtin.set_fact:
    fnm_bin: "{{ fnm_lookup_after_install.stdout | trim }}"

- name: Verify fnm is available
  ansible.builtin.assert:
    that:
      - fnm_bin != ""
    fail_msg: "fnm was not found on PATH after install. Checked PATH={{ fnm_path_env }}"

- name: Install default Node version via fnm
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    argv:
      - "{{ fnm_bin }}"
      - install
      - --lts
  environment:
    FNM_DIR: "{{ fnm_dir }}"
    FNM_PATH: "{{ fnm_dir }}"
    PATH: "{{ fnm_path_env }}"

- name: Get latest installed fnm Node version
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.shell:
    cmd: |
      node_versions_dir="{{ fnm_dir }}/node-versions"
      mkdir -p "$node_versions_dir"
      python3 - "$node_versions_dir" <<'PY'
      import re
      import sys
      from pathlib import Path

      root = Path(sys.argv[1])

      def version_key(path):
          parts = []
          for part in path.name.lstrip("v").split("."):
              match = re.match(r"\d+", part)
              parts.append(int(match.group(0)) if match else -1)
          return tuple(parts)

      versions = [path for path in root.iterdir() if path.is_dir()]
      if versions:
          print(max(versions, key=version_key).name)
      PY
  register: fnm_default_version
  changed_when: false
  environment:
    FNM_DIR: "{{ fnm_dir }}"
    FNM_PATH: "{{ fnm_dir }}"
    PATH: "{{ fnm_path_env }}"

- name: Set default Node version via fnm
  when: fnm_default_version.stdout != ""
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    argv:
      - "{{ fnm_bin }}"
      - default
      - "{{ fnm_default_version.stdout }}"
  environment:
    FNM_DIR: "{{ fnm_dir }}"
    FNM_PATH: "{{ fnm_dir }}"
    PATH: "{{ fnm_path_env }}"

- name: Install npm global packages
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  community.general.npm:
    name: "{{ item }}"
    executable: "{{ fnm_dir }}/aliases/default/bin/npm"
    global: true
    state: present
  environment:
    FNM_DIR: "{{ fnm_dir }}"
    FNM_PATH: "{{ fnm_dir }}"
    PATH: "{{ fnm_dir }}/aliases/default/bin:{{ fnm_path_env }}"
  loop: "{{ npm_global_packages }}"

# uv (Python package manager)
- name: Check if uv is installed
  ansible.builtin.stat:
    path: "{{ user_home }}/.local/bin/uv"
  register: uv_installed

- name: Install uv
  when: not uv_installed.stat.exists
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.shell:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh

# bun
- name: Check if bun is installed
  ansible.builtin.stat:
    path: "{{ user_home }}/.bun/bin/bun"
  register: bun_installed

- name: Install bun
  when: not bun_installed.stat.exists
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.shell:
    cmd: curl -fsSL https://bun.sh/install | bash
