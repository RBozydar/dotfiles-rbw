---
- name: Check if rustup is installed
  ansible.builtin.stat:
    path: "{{ user_home }}/.cargo/bin/rustup"
  register: rustup_installed

- name: Install rustup
  when: not rustup_installed.stat.exists
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.shell:
    cmd: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable

- name: Install cargo-update
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    cmd: "{{ user_home }}/.cargo/bin/cargo install cargo-update"
    creates: "{{ user_home }}/.cargo/bin/cargo-install-update"
  environment:
    PATH: "{{ user_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Check if NVIDIA runtime is available for colgrep CUDA build
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    cmd: nvidia-smi -L
  register: colgrep_nvidia_smi
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - enable_nvidia | bool

- name: Set colgrep install arguments
  ansible.builtin.set_fact:
    colgrep_cargo_features: >-
      {%- set has_nvidia = enable_nvidia | bool and target_system == 'Linux' and (colgrep_nvidia_smi is defined) and colgrep_nvidia_smi.rc == 0 -%}
      {%- if target_system == 'Darwin' -%}
      accelerate,coreml
      {%- elif target_system == 'Linux' and has_nvidia -%}
      cuda
      {%- elif target_system == 'Linux' -%}
      openblas
      {%- else -%}
      {{ '' }}
      {%- endif -%}

- name: Install colgrep
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    argv: "{{ [user_home ~ '/.cargo/bin/cargo', 'install', 'colgrep'] + (['--features', colgrep_cargo_features | trim] if (colgrep_cargo_features | trim) else []) }}"
  environment:
    PATH: "{{ user_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Set GPU colgrep model
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    cmd: "{{ user_home }}/.cargo/bin/colgrep set-model lightonai/LateOn-Code"
  environment:
    PATH: "{{ user_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - enable_nvidia | bool
    - (colgrep_nvidia_smi is defined) and colgrep_nvidia_smi.rc == 0

- name: Set GPU colgrep precision
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    cmd: "{{ user_home }}/.cargo/bin/colgrep settings --fp32"
  environment:
    PATH: "{{ user_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - enable_nvidia | bool
    - (colgrep_nvidia_smi is defined) and colgrep_nvidia_smi.rc == 0

- name: Set GPU colgrep pooling
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    cmd: "{{ user_home }}/.cargo/bin/colgrep settings --pool-factor 1"
  environment:
    PATH: "{{ user_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - enable_nvidia | bool
    - (colgrep_nvidia_smi is defined) and colgrep_nvidia_smi.rc == 0
