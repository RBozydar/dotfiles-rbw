---
- name: Ensure Claude home exists
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.file:
    path: "{{ claude_home }}"
    state: directory
    mode: "0700"
  tags:
    - claude

- name: Ensure dotfiles helper directory exists
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.file:
    path: "{{ dotfiles_helper_dir }}"
    state: directory
    mode: "0700"
  tags:
    - claude
    - claude-settings

- name: Copy Claude settings merge helper
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.copy:
    src: "{{ claude_merge_settings_script_source }}"
    dest: "{{ claude_merge_settings_script }}"
    mode: "0755"
  tags:
    - claude
    - claude-settings

- name: Merge shared Claude settings
  become: "{{ user_task_become | bool }}"
  become_user: "{{ username }}"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ claude_merge_settings_script }}"
      - "{{ claude_shared_settings_path }}"
      - "{{ claude_settings_path }}"
  environment:
    HOME: "{{ user_home }}"
  register: claude_settings_merge
  changed_when: claude_settings_merge.stdout == "changed"
  tags:
    - claude
    - claude-settings
