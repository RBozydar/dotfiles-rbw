---
security_ssh_port: 666
security_ssh_password_authentication: "no"
security_ssh_permit_root_login: "no"
security_ssh_usedns: "no"
security_ssh_permit_empty_password: "no"
security_ssh_challenge_response_auth: "no"
security_ssh_gss_api_authentication: "no"
security_ssh_x11_forwarding: "no"
security_ssh_allowed_users:
  - "{{ username }}"
security_autoupdate_enabled: true
security_autoupdate_reboot: "false"
security_fail2ban_enabled: true
ansible_ssh_user: "{{ lookup('env', 'USER') }}"

username: "{{ lookup('env', 'USER') }}"
user_home: "{{ lookup('env', 'HOME') }}"
user_task_become: "{{ (ansible_user_id | default(username)) != username }}"
repo_root: "{{ lookup('env', 'DOTFILES_REPO_ROOT') | default((playbook_dir | dirname), true) }}"
legacy_repo_root: "{{ user_home }}/repo/dotfiles"
zshrc_home: "{{ user_home }}/.zshrc"
zshrc_repo: "{{ repo_root }}/home/.zshrc"
home_repo: "{{ repo_root }}/home"
manage_legacy_repo_symlink: "{{ repo_root != legacy_repo_root }}"
codex_home: "{{ lookup('env', 'CODEX_HOME') | default(user_home ~ '/.codex', true) }}"
codex_config_path: "{{ codex_home }}/config.toml"
codex_shared_pets:
  - dotneko
  - tabbyneko
dotfiles_helper_dir: "{{ user_home }}/.local/share/dotfiles-rbw/ansible"
codex_merge_config_script_source: "{{ playbook_dir }}/files/codex/merge-config.py"
codex_merge_config_script: "{{ dotfiles_helper_dir }}/merge-codex-config.py"
claude_home: "{{ user_home }}/.claude"
claude_settings_path: "{{ claude_home }}/settings.json"
claude_shared_settings_path: "{{ home_repo }}/config/claude/settings.json"
claude_merge_settings_script_source: "{{ playbook_dir }}/files/claude/merge-settings.py"
claude_merge_settings_script: "{{ dotfiles_helper_dir }}/merge-claude-settings.py"

homebrew_prefix_default: >-
  {{
    '/opt/homebrew'
    if ansible_system == 'Darwin' and ansible_architecture in ['arm64', 'aarch64']
    else '/usr/local'
    if ansible_system == 'Darwin'
    else '/home/linuxbrew/.linuxbrew'
  }}
homebrew_prefix: "{{ ansible_env.HOMEBREW_PREFIX | default(homebrew_prefix_default, true) }}"
homebrew_bin: "{{ homebrew_prefix }}/bin/brew"
homebrew_path_env: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
yazi_bin: "{{ homebrew_prefix }}/bin/ya"

miniforge_root: "{{ lookup('env', 'CONDA_HOME') | default(user_home ~ '/miniforge3', true) }}"
miniforge_platform: "{{ 'MacOSX' if ansible_system == 'Darwin' else 'Linux' }}"
miniforge_arch: >-
  {{
    'x86_64'
    if ansible_architecture in ['x86_64', 'amd64']
    else 'aarch64'
    if ansible_architecture == 'aarch64'
    else 'arm64'
    if ansible_architecture == 'arm64'
    else ansible_architecture
  }}
miniforge_installer_filename: "Miniforge3-{{ miniforge_platform }}-{{ miniforge_arch }}.sh"
miniforge_installer_url: "https://github.com/conda-forge/miniforge/releases/latest/download/{{ miniforge_installer_filename }}"
miniforge_installer_path: "/tmp/{{ miniforge_installer_filename }}"

enable_gui: false
enable_nvidia: false
enable_private_apps: false
configure_macos_defaults: true
configure_codex: true
configure_claude: true
enable_git_role: true
enable_security_role: true
