macos_brew_casks: >-
  {{
    macos_common_brew_casks
    + (
      macos_macos14_brew_casks
      if target_system == 'Darwin'
      and target_distribution_version is version('14.0', '>=')
      else []
    )
    + (
      macos_macos14_arm64_brew_casks
      if target_system == 'Darwin'
      and target_distribution_version is version('14.0', '>=')
      and target_architecture in ['arm64', 'aarch64']
      else []
    )
    + (macos_work_brew_casks if enable_work_apps | bool else [])
    + (macos_private_brew_casks if enable_private_apps | bool else [])
  }}

