set-option -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB,tmux-256color:RGB,xterm-ghostty:RGB'
set -as terminal-features ',xterm-256color:clipboard,tmux-256color:clipboard,xterm-ghostty:clipboard'
set -as terminal-features ',xterm-ghostty:hyperlinks'
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g mouse on
# Slow mouse-wheel scrolling in tmux copy mode to one line per tick.
bind -T copy-mode-vi WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down
bind -T copy-mode WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode WheelDownPane send -N 1 -X scroll-down
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-processes '"~claude->claude --resume"'
set -g @resurrect-processes '"~codex->codex resume"'
set -g @resurrect-capture-pane-contents 'on'
set -g renumber-windows on
set -g set-clipboard on
set-environment -gu PROMPT_COMMAND
set -g status-position top
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind < resize-pane -L 10
bind > resize-pane -R 10
bind + resize-pane -D 10
bind - resize-pane -U 10
bind m if -F '#{mouse}' 'set -g mouse off; display-message "tmux mouse: off"' 'set -g mouse on; display-message "tmux mouse: on"'
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

run '~/.tmux/plugins/tmux/catppuccin.tmux'
run '~/.tmux/plugins/tpm/tpm'

set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -g automatic-rename off
set -g allow-rename off
# needed for vim/neovim autoread and focus detection
set -g focus-events on
set -g status-interval 5
set -g display-time 4000
set -g aggressive-resize on

# Keep TPM last so tmux-continuum can append its hidden autosave hook after any
# theme or manual status-right changes above.
run '~/.tmux/plugins/tpm/tpm'
